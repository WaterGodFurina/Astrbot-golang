}

// --- Plugin/Star management payloads ----------------------------------------

message StarPayload {
  string name = 1;
  string author = 2;
  string desc = 3;
  string version = 4;
  string module_path = 5;
  bool activated = 6;
  string repo = 7;
}

message GetStarRequest {
  string name = 1;
}

message StarsResponse {
  repeated bytes stars_json = 1; // JSON of StarPayload
}

// 单条命令描述符（JSON 序列化承载，对齐宿主 star.CommandDescriptor）。
message CommandDescriptorPayload {
  string plugin_name = 1;       // 归属插件 id（如 astrbot_plugin_xxx_python）
  string handler_full_name = 2; // 宿主注册表全名
  string handler_name = 3;      // 命令 handler 名
  string command = 4;           // 有效命令（组命令为组名）
  repeated string aliases = 5;  // 别名（不含父组前缀）
  string description = 6;
  string permission = 7;        // "admin" | "member"
  bool enabled = 8;
  string parent_group = 9;      // 子命令的父组名（非子命令为空）
  bool is_sub_command = 10;
  string command_type = 11;     // "group" 或空
}

message CommandDescriptorsResponse {
  repeated bytes descriptors_json = 1; // JSON of CommandDescriptorPayload
}

// 单条平台实例元数据（JSON 序列化承载）。
message PlatformPayload {
  string id = 1;           // 实例 ID（如 "default"）
  string type = 2;         // 平台类型（如 "aiocqhttp"）
  string name = 3;         // 类型名（同 type）
  string display_name = 4; // 展示名
  bytes config_json = 5;   // 平台配置 JSON（appid 等）
}

message PlatformsResponse {
  repeated bytes platforms_json = 1; // JSON of PlatformPayload
}

message StarResponse {
  bytes star_json = 1; // JSON of StarPayload
}

message SetPluginEnabledRequest {
  string plugin_name = 1;
  bool enabled = 2;
}

message InstallPluginRequest {
  string repo = 1; // git url / plugin name
}

message UninstallPluginRequest {
  string plugin_name = 1;
}

// --- Session wait payloads --------------------------------------------------

message RegisterSessionWaitRequest {
  // Unified message origin the plugin waits on (e.g. "aiocqhttp:GroupMessage:123").
  string umo = 1;
  // Timeout seconds after which the wait expires (host does not push events).
  int32 timeout_seconds = 2;
}

message RegisterSessionWaitResponse {
  // Host-assigned wait id, used by UnregisterSessionWait.
  string wait_id = 1;
}

message UnregisterSessionWaitRequest {
  string wait_id = 1;
}

// 插件向宿主注册"桥接钩子"（botpy/telegram 等兼容层用）：宿主收到入站
// 消息时把序列化事件推给该插件的 HandleHook(name=hook_name)，兼容层再
// 分发到装饰器注册的 handler。注册表为空 = 宿主零额外推送开销。
message BridgeHookRequest {
  string plugin_name = 1;
  string hook_name = 2;
}

message FeedSessionWaitRequest {
  reserved 1; // 曾为 legacy event_json（P1 移除）
  // 原生事件（P1）。
  SDKEvent event = 2;
}

message FeedSessionWaitResponse {
  // Whether a registered wait consumed this event.
  bool handled = 1;
}

message GetConfigSchemaResponse {
  bytes schema_json = 1; // JSON schema (FlatSchema format: {"type":..., "properties":{...}} or raw)
}

// ── 技能（Skills）──
// 宿主 internal/skills 的 SkillInfo 序列化（字段名与 Python SDK
// skills/SkillInfo + 宿主 go ListSkillsInfo 对齐）。
message SkillsResponse {
  repeated bytes skills_json = 1; // 每条为 SkillInfo JSON（name/description/path/active/...）
}

message SetSkillActiveRequest {
  // 技能名（目录段安全校验由宿主执行）。
  string name = 1;
  bool active = 2;
}

message DeleteSkillRequest {
  string name = 1;
}

// ── 平台消息历史 ──
// 与宿主 db platform_message_history 表 + Python SDK
// PlatformMessageHistoryManager 字段对齐。
message PMHistoryRecord {
  int64 id = 1;
  string platform_id = 2;
  string user_id = 3;
  string sender_id = 4;
  bytes content_json = 5;
  string llm_checkpoint_id = 6;
  string created_at = 7; // RFC3339 / ISO 串
}

message GetPMHistoryRequest {
  // 平台实例 ID（空 = 全部）。
  string platform_id = 1;
  // 用户 ID / unified message origin（空 = 全部）。
  string user_id = 2;
  // 返回最近 limit 条（<=0 = 宿主默认 200）。
  int32 limit = 3;
}

message PMHistoryRecordsResponse {
  repeated bytes records_json = 1; // 每条为 PMHistoryRecord JSON
}

message InsertPMHistoryRequest {
  string platform_id = 1;
  string user_id = 2;
  string sender_id = 3;
  bytes content_json = 4;
  string llm_checkpoint_id = 5;
  // max_messages：该 (platform_id,user_id) 键保留的最大条数
  //（>0 时宿主自动裁剪最旧记录；=0 / 省略按宿主默认）。
  int32 max_messages = 6;
}

message PMHistoryRecordResponse {
  bytes record_json = 1; // 插入后的完整记录 JSON
}

message UpdatePMHistoryRequest {
  int64 id = 1;
  bytes content_json = 2;
  string llm_checkpoint_id = 3;
}

message DeletePMHistoryRequest {
  int64 id = 1;
}

// ── 知识库（KnowledgeBase，宿主 internal/knowledgebase/manager.go）──

// KBRetrieveRequest 检索请求。kb_names 空 = 宿主全部启用中的知识库。
message KBRetrieveRequest {
  // 检索查询文本。
  string query = 1;
  // 限定参与检索的知识库名列表；空 = 宿主全部启用 KB。
  repeated string kb_names = 2;
  // 融合召回条数（<=0 用宿主默认）。
  int32 top_k_fusion = 3;
  // 最终保留条数（<=0 用宿主默认）。
  int32 top_m_final = 4;
}

// KBRetrieveResponse 检索结果。results_json 为检索结果 JSON 数组
// （空结果时 context_text 为空、results_json 为 "[]"）。
message KBRetrieveResponse {
  // 拼接后的检索上下文文本（可直接注入 prompt）。
  string context_text = 1;
  // 检索结果 JSON 数组（分块内容/来源/分数等，结构以宿主检索结果为准）。
  string results_json = 2;
}

// KBUploadFromURLRequest 从 URL 拉取文档写入指定知识库并分块。
message KBUploadFromURLRequest {
  // 目标知识库 ID（宿主 KnowledgeBase.kb_id）。
  string kb_id = 1;
  // 文档来源 URL。
  string url = 2;
  // 分块大小（<=0 用宿主默认）。
  int32 chunk_size = 3;
  // 分块重叠（<=0 用宿主默认）。
  int32 chunk_overlap = 4;
}

// KBListResponse 列出宿主全部知识库。每项为一个 KnowledgeBase 元数据
// JSON（kb_id/kb_name/description/emoji/doc_count/chunk_count 等，字段
// 以宿主 KnowledgeBase 结构为准）。
message KBListResponse {
  repeated bytes kbs_json = 1;
}

// ── 技能视图扩展（sandbox runtime 视图）──

// ListSkillsV2Request 带过滤参数的技能列表请求。runtime 取值：
// "local"（仅宿主本地）/ "sandbox"（仅 sandbox runtime 视图）/ ""（全部）。
message ListSkillsV2Request {
  // 仅返回启用中的技能。
  bool active_only = 1;
  // 运行时过滤："local"/"sandbox"/""=全部。
  string runtime = 2;
  // true 时技能 JSON 的 path 字段返回 sandbox 路径而非宿主本地路径。
  bool show_sandbox_path = 3;
}

// ── 文件令牌（file_token 文件服务）──

// RegisterFileTokenRequest 把宿主侧文件路径登记为令牌。
message RegisterFileTokenRequest {
  // 宿主侧文件绝对路径（安全校验由宿主执行）。
  string path = 1;
  // 令牌 TTL 秒数；0 = 宿主默认 TTL。
  int32 timeout_sec = 2;
}

// RegisterFileTokenResponse 返回文件令牌：下游凭 token 读取文件，
// 避免暴露真实路径。
message RegisterFileTokenResponse {
  string token = 1;
}

// ── 插件定时任务（宿主 internal/cron）──

// CronCreateRequest 创建定时任务。job_type 由宿主 internal/cron 定义；
// run_once=true 时 run_at（RFC3339，可空）指定一次性触发时间。
message CronCreateRequest {
  // 任务名。
  string name = 1;
  // 任务类型（对齐宿主 Job.Type，如 cron / interval / once）。
  string job_type = 2;
  // cron 表达式（job_type=cron 时有效）。
  string cron_expression = 3;
  // IANA 时区（空 = 宿主默认）。
  string timezone = 4;
  // 任务负载 JSON（宿主触发时回传插件）。
  bytes payload_json = 5;
  // 任务描述。
  string description = 6;
  // 是否启用。
  bool enabled = 7;
  // 是否一次性任务。
  bool run_once = 8;
  // 一次性任务的触发时间（RFC3339，可空）。
  string run_at = 9;
}

// CronUpdateRequest 按 job_id 更新任务字段。fields_json 为更新字段集
// JSON：{name?, cron_expression?, timezone?, payload?, description?,
// enabled?}，仅出现的字段会被更新。
message CronUpdateRequest {
  // 目标任务 ID。
  string job_id = 1;
  // 更新字段集 JSON（部分更新语义）。
  bytes fields_json = 2;
}

// CronJobResponse 返回宿主 Job 快照 JSON：job_id/name/job_type/
// cron_expression/payload/enabled/next_run_time/last_run_at/status 等。
message CronJobResponse {
  bytes job_json = 1;
}

// CronDeleteRequest 删除指定定时任务。
message CronDeleteRequest {
  string job_id = 1;
}

// CronListRequest 列出任务。job_type 空 = 全部类型。
message CronListRequest {
  string job_type = 1;
}

// CronJobsResponse 任务列表（每项为一个 Job 快照 JSON）。
message CronJobsResponse {
  repeated bytes jobs_json = 1;
}

// CronRunNowRequest 立即触发一次指定任务。
message CronRunNowRequest {
  string job_id = 1;
}

// ── 定时任务触发（宿主 cron 到点 → 插件，FeedCronJob 通道）──

// FeedCronJobRequest 宿主 cron 到点触发插件注册的 basic 任务（宿主 → 插件
// 方向）。插件按 job_id 匹配注册时保留的本地 handler 并执行。
message FeedCronJobRequest {
  // 宿主 Job ID（CronCreate 返回快照的 job_id）。
  string job_id = 1;
  // 任务名（冗余携带，便于插件侧日志）。
  string job_name = 2;
  // 任务负载 JSON（含宿主注入的 _plugin_id 路由键；handler 触发参数以
  // 用户 payload 为准，路由键由插件侧剥离）。
  bytes payload_json = 3;
  // 宿主实际触发时刻（RFC3339）。
  string run_at = 4;
}

// FeedCronJobResponse handled=插件存在匹配 handler 并已调度执行；无匹配
// handler 返回 false（对齐 FeedSessionWait 语义）。
message FeedCronJobResponse {
  bool handled = 1;
}

// ── 宿主 MCP 读写桥接（只读列出 + 调用宿主侧 MCP 工具）──

// McpToolsResponse 列出宿主已连接 MCP server 的工具。每项 JSON 结构：
// {server, name, description, schema_json}。
message McpToolsResponse {
  repeated bytes tools_json = 1;
}

// McpCallToolRequest 调用宿主侧 MCP 工具。
message McpCallToolRequest {
  // MCP server 名。
  string server = 1;
  // 工具名。
  string tool_name = 2;
  // 工具参数 JSON 对象。
  bytes arguments_json = 3;
}

// McpCallToolResponse 工具调用结果。text 为纯文本摘要，result_json 为
// 完整结果 JSON（含结构化 content），is_error 标记宿主侧调用是否出错。
message McpCallToolResponse {
  // 完整结果 JSON。
  bytes result_json = 1;
  // 宿主侧调用是否出错。
  bool is_error = 2;
  // 纯文本摘要。
  string text = 3;
}
