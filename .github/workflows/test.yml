name: AstrBot-golang 测试

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '测试的 git 引用（分支/tag/SHA）。留空 = 当前分支'
        required: false
        default: ''
  push:
    branches:
      - test

jobs:
  test:
    name: Go 测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: 设置 Go 版本（自动跟随 go.mod）
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 安装 Python（插件子进程测试需要）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: apt 缓存（字体安装加速）
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives/*.deb
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: 安装中文字体（t2i 测试需要）
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-droid-fallback

      - name: 配置 Go 环境（代理与模块）
        env:
          GOPROXY: https://goproxy.cn,direct
          GONOSUMDB: github.com/youkale/go-querystruct,github.com/WaterGodFurina/nanovec
          GOFLAGS: -mod=mod
        run: |
          go env -w GOPROXY="https://goproxy.cn,direct"
          go env -w GONOSUMDB="github.com/youkale/go-querystruct,github.com/WaterGodFurina/nanovec"

      - name: 编译检查
        run: go build ./...

      - name: go vet
        run: go vet ./... 2>&1 | grep -v "copies lock value" || true

      - name: 运行全部测试
        timeout-minutes: 30
        env:
          CGO_ENABLED: '0'
          PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
          ASTRBOT_PYPI_INDEX: https://mirrors.aliyun.com/pypi/simple/
        run: go test ./... -count=1 -timeout 25m

      - name: 上传失败测试日志
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-output
          path: |
            **/test*.log
            **/TEST-*.xml
          if-no-files-found: ignore

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 启用 pnpm
        run: corepack enable

      - name: pnpm store 缓存
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v3
          key: ${{ runner.os }}-pnpm-${{ hashFiles('dashboard/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        working-directory: dashboard

      - name: 前端构建（含 t2i shiki runtime）
        run: pnpm build && pnpm build:t2i-shiki-runtime
        working-directory: dashboard

      - name: 校验构建产物
        run: |
          ls -la dist/ | head
          ls -la scripts/t2i/shiki_runtime.iife.js 2>/dev/null || find . -name "shiki_runtime.iife.js" | head
        working-directory: dashboard