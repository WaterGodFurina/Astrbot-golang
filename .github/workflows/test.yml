name: AstrBot-golang 测试

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '测试的 git 引用（分支/tag/SHA）。留空 = 当前分支'
        required: false
        default: ''
  push:
    branches:
      - test

jobs:
  test:
    name: Go 测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: 设置 Go 版本（自动跟随 go.mod）
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 安装 Python（插件子进程测试需要）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装中文字体（t2i 测试需要）
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk

      - name: 配置 Go 环境（代理与模块）
        env:
          GOPROXY: https://goproxy.cn,direct
          GONOSUMDB: github.com/youkale/go-querystruct,github.com/WaterGodFurina/nanovec
          GOFLAGS: -mod=mod
        run: |
          go env -w GOPROXY="https://goproxy.cn,direct"
          go env -w GONOSUMDB="github.com/youkale/go-querystruct,github.com/WaterGodFurina/nanovec"

      - name: 编译检查
        run: go build ./...

      - name: go vet
        run: go vet ./... 2>&1 | grep -v "copies lock value" || true

      - name: 运行全部测试
        timeout-minutes: 30
        env:
          CGO_ENABLED: '0'
          PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
          ASTRBOT_PYPI_INDEX: https://mirrors.aliyun.com/pypi/simple/
        run: go test ./... -count=1 -timeout 25m

      - name: 上传失败测试日志
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-output
          path: |
            **/test*.log
            **/TEST-*.xml
          if-no-files-found: ignore